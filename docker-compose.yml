services:
  openpolytrader:
    build:
      context: .
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const p=process.env.PORT||3000; fetch(`http://127.0.0.1:${p}/health/live`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      NODE_ENV: production
      OPS_API_ENABLED: "true"
      OPS_API_HOST: 0.0.0.0
      PORT: "3000"
      MARKET_CATALOG_PATH: /app/data/market-catalog.json
      TRADING_ENABLED: "false"
    volumes:
      - ./data:/app/data
